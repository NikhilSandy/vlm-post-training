[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-coco-token-explorer"
version = "0.1.0"
description = "Qwen vision-token exploration and COCO instance-classification experiments"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
qwen-token-explorer = "qwen_token_explorer.app:main"
coco-option-attention = "coco_classification.evaluate_option_attention:main"
coco-readout-evaluation = "coco_classification.evaluate_coco:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["qwen_token_explorer*", "coco_classification*"]
